# Local development services: PostgreSQL and Mailpit (fake SMTP inbox at http://localhost:8025).

services:
  postgres:
    image: postgres:17
    container_name: camerashop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: camerashop-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
